name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Every fixture is synthetic, so the suite passes with no WRDS credentials.
      # That is deliberate: the mathematics stays auditable by anyone who cannot
      # download the licensed panel.
      - name: Test
        run: uv run pytest -q
